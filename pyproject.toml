[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdutils"
version = "0.1.0"
description = "My own atomic framework"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "pandas",
    "ase",
    "openmm",
    "click",
    "tqdm",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
plotkit = ["plot/styles/*.mplstyle"]
